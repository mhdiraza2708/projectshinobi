name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2

jobs:
  godot-tests:
    name: Godot tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Run tests
        run: ~/godot/godot --headless --path game res://tests/test_runner.tscn

      - name: Screenshots
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri > /dev/null
          mkdir -p screenshots
          for demo in overview weave cast menu title trial story story_menu; do
            xvfb-run -a -s "-screen 0 1280x720x24" ~/godot/godot --path game \
              --rendering-driver opengl3 --rendering-method gl_compatibility --audio-driver Dummy \
              -- --screenshot="$PWD/screenshots/$demo.png" --demo=$demo
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  windows-build:
    name: Windows build
    needs: godot-tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      # The full template bundle is ~1 GB; only the Windows release template
      # is kept and cached.
      - name: Cache export template
        id: cache-templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-windows-${{ env.GODOT_VERSION }}

      - name: Download export template
        if: steps.cache-templates.outputs.cache-hit != 'true'
        run: |
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          curl -fsSL -o /tmp/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j /tmp/templates.tpz templates/windows_release_x86_64.exe templates/version.txt -d "$dir"
          rm /tmp/templates.tpz

      - name: Import project
        run: ~/godot/godot --headless --path game --import

      - name: Export
        run: |
          mkdir -p build/windows
          ~/godot/godot --headless --path game --export-release "Windows Desktop" ../build/windows/ProjectShinobi.exe
          test -s build/windows/ProjectShinobi.exe
          # Characters ship as packs next to the exe (loaded at startup).
          for i in 1 2 3; do
            ~/godot/godot --headless --path game --export-pack "Characters $i" ../build/windows/characters_$i.pck
            test -s build/windows/characters_$i.pck
          done
          cp "dist/HOW TO PLAY.txt" build/windows/

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ProjectShinobi-Windows
          path: build/windows/
          retention-days: 30

  blender-assets:
    name: Blender asset pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: art/blender/requirements.txt

      - name: Install Blender (bpy)
        run: pip install -r art/blender/requirements.txt

      - name: Build every asset
        run: python art/blender/build_assets.py --out /tmp/assets

      - name: Every committed model is reproducible by the script
        run: |
          for f in game/assets/models/*.glb; do
            test -f "/tmp/assets/$(basename "$f")" || { echo "::error::$f has no generator"; exit 1; }
          done
